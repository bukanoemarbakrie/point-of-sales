<!DOCTYPE html>
<html>
<head>
  <title>Latihan</title>
</head>
<body>

<h2>Form Kelulusan Siswa</h2>

<form action="" method="post" onsubmit="cekKelulusan()">
  <label>Nama:</label><br>
  <input type="text" id="nama" required><br><br>

  <label>Nilai Teori:</label><br>
  <input type="number" id="nilaiTeori" required><br><br>

  <label>Nilai Praktek:</label><br>
  <input type="number" id="nilaiPraktek" required><br><br>

  <label>Kehadiran (%):</label><br>
  <input type="number" id="kehadiran" required><br><br>

  <button type="submit">Cek Kelulusan</button>
</form>

<h3>Hasil:</h3>
<p id="hasil"></p>

<script>
  function cekKelulusan() {
    event.preventDefault(); 
    // agar form tidak pindah halaman

    let nama = document.getElementById("nama").value;
    let nilaiTeori = Number(document.getElementById("nilaiTeori").value);
    let nilaiPraktek = Number(document.getElementById("nilaiPraktek").value);
    let kehadiran = Number(document.getElementById("kehadiran").value);

    let rataRata = (nilaiTeori + nilaiPraktek) / 2;

    let status = "";

    if (rataRata >= 75 && nilaiPraktek >= 75 && kehadiran >= 90) {
      if (rataRata > 90) {
        status = "Lulus - Sangat Baik";
      } else {
        status = "Lulus";
      }
    } else {
      status = "Tidak Lulus";
    }

    document.getElementById("hasil").innerHTML =
      "Nama: " + nama + "<br>" +
      "Rata-rata: " + rataRata + "<br>" +
      "Status: " + status;
  }
</script>

</body>
</html>
