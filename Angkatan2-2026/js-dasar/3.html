    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator Sederhana</title>
  </head>
  <body>
    <form action="" method="post" onsubmit="return false;" ;>
      <label for="">Nilai 1</label>
      <input type="number" id="nilai1" /><br />
      <select name="" id="operator">
        <option value="">Pilih Operation</option>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option></select
      ><br />
      <label for="">Nilai 2</label>
      <input type="number" id="nilai2" /><br />
      <button onclick="perhitungan()">Hasil Perhitungan</button>
      <label for="hasil">Hasil</label>
      <input type="text" id="hasil" placeholder="Hasil" readonly /><br /><br />
    </form>

    <script>
      function perhitungan() {
        let nilai1 = parseFloat(document.getElementById("nilai1").value);
        let nilai2 = parseFloat(document.getElementById("nilai2").value);
        let operator = document.getElementById("operator").value;
        let hasil = 0;
        switch (operator) {
          case "*":
            hasil = nilai1 * nilai2;
            break;
          case "/":
            hasil = nilai2 == 0 ? "Tidak Boleh 0" : nilai1 / nilai2;
            break;
          case "+":
            hasil = nilai1 + nilai2;
            break;
          case "-":
            hasil = nilai1 - nilai2;
            break;

          default:
            hasil = `Hasil Tidak Ada`;
        }
        document.getElementById("hasil").value = hasil;
      }
