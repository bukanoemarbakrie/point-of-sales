<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipe data</title>
  </head>

  <body>
    <!-- ""'' :string -->
    <script>
      const nama_depan = "Jeje";
      const nama_belakang = "maulina";
      //   ``: template literal
      // interpolation; ${}
      let nama = "budi";
      let alamat = "bekasi";
      let pesan = `halo ${nama}, tinggal di ${alamat} yahh.`;
      let angka1 = 1;
      let angka2 = 1;

      let a = 5;
      a += 10;
      console.log(a);

      let username = "admin";
      let password = "admin";
      //   ==, === nilai + tipe data, !=: tidak sama dengan, !==: tidak sama dengan + tipe data
      // >, <, >=, <=

      if (username == "admin") {
        console.log("iya bener");
      }

      console.log(5 === "5");
      console.log(5 > 10);
      console.log(5, 10);

      if (username == "admin" && password == "123") {
        console.log("anda berhasil login");
      } else {
        console.log("login gagal");
      }

      //   operator tenary : short if
      let umur = 20;
      let status = ((umur) => 20) ? "dewasa" : "anak-anak";
      // kondisi ? nilaiTrueJika : nilaiFalseJika;
      console.log(status);

      switch (username) {
        case "admin":
          console.log("iya itu admin");
          break;
        default:
          console.log("bukan admin");
      }

      console.log("hasilnya adalah:", angka1 + angka2);
      console.log(`hasilnya adalah: ${angka1 + angka2}`);
      console.log(nama_depan + " " + nama_belakang);
      console.log(pesan);
      console.log(`hasil perkalian dari 10 * 10 adalah : ${10 * 10}`);
    </script>
  </body>
</html>
