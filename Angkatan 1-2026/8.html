<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matcha Ube</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        padding: 200px;
      }
      .card {
        width: 280px;
        background: #ffff;
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 4 10px;
      }
      .product-header{
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .tittle {
        font-size: 18px;
        font-weight: bold;
      }
      .category {
        color: #999;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .price {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .price span {
        font-size: 22px;
        font-weight: bold;
      }
      .discount {
        background: #ffc107;
        color: #fff;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 6px;
      }
      .stock {
        font-size: 14px;
        color: #666;
        margin-bottom: 15px;
      }
      .section-title {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
      }
      .options {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }
      .option {
        padding: 6px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      .option.active {
        background: #000;
        color: #fff;
        border-color: #000;
      }
      .product {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 12px;
      }
    </style>
    </style>
  </head>
  <body>
    <div class="container">
        <div class="card">
            <div class="product-header">
                    <img width="100" src="https://i.ytimg.com/vi/bOW-7Jz6UAA/maxresdefault.jpg" alt="product" />
                      <div class="tittle">Matcha Ube <br> Coffe & Beverage</div>
                    </div>
                    <!-- <div class="category">Coffe & Beverage</div> -->
                    <div class="price">
                       <span>$5.00</span>
                       <div class="discount">10% OFF</div>
                     </div>
                     <div class="stock">Ready Stock: <b>58 pcs</b></div>
                     <div class="section-title">Temperature</div>
                     <div class="d-flex gap-1">
                       <div class="options">
                         <div class="option active">Ice</div>
                         <div class="option">Hot</div>
                         <div class="section-title mb-3 p-2">Size</div>
                         <div class="options">
                           <div class="option">S</div>
                           <div class="option active">M</div>
                           <div class="option">L</div>
                          </div>
                        </div>
                       </div>
          </div>
      </div>
  </body>
</html>
  </body>
</html>
