<!-- 
DOM: document object model
- memanipulasi data atau text
- warna
- mengubah isi text 
- menghapus element
- menagani event ( click, change, hover,onInput dll ) 
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar DOM</title>
  </head>
  <body>
    <!--  1. element / tag, 2. attribute (class dan id) -->
    <h1>Ini h1 Normal tidak di apa-apain</h1>
    <div class="content"></div>
    <img src="https://placehold.net/400x400.png" alt="" id="gambar" />
    <ul id="list"></ul>
    <footer id="footer">Design By jessica</footer>

    <script>
      const judul = document.querySelector("h1");
      const content = document.querySelector(".content");
      const footer = document.getElementById("footer");
      const gambar = document.querySelector("#gambar");

      const list = document.getElementById("list");
      const li = document.createElement("li");
      li.innerText = "Mie Goreng";
      li.innerText = "Mie Rebus";

      list.appendChild(li);

      judul.innerText = "Belajar DOM";
      content.style.backgroundColor = "pink";
      content.style.color = "white";
      content.innerHTML = "<h3>Content dengan javascript</h3>";

      footer.innerText = "Design By PPKD JP 2026";
      footer.style.textAlign = "center";

      gambar.src = "gambarbaru.png";
      gambar.alt = "Gambar Baru";

      console.log(document);
    </script>
  </body>
</html>
