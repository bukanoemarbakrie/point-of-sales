<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM HTML</title>
    <style>
      body {
        background-color: rgb(253, 199, 246);
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        margin-top: 10px;
      }
      input[type="text"],
      input[type="mail"],
      input[type="date"],
      select {
        width: 95%;
        padding: 10px;
        border: 1px solid black;
        border-radius: 4px;
      }
      button {
        padding: 10px;
        background-color: rgb(247, 226, 244);
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
      }
      button:hover {
        background-color: red;
      }
      .tittle h1:first-child {
        color: rgb(133, 20, 0);
      }
      h1 {
        color: palevioletred;
      }

      .container {
        width: 400px;
        margin: 50px auto;
        background-color: rgb(176, 236, 247);
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px black;
      }
      .form-group {
        margin-bottom: 5px;
      }
      .radio-group,
      .checkbox-group {
        display: flex;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="tittle">
        <h1 class="red">Data Peserta</h1>
      </div>
      <form action="" method="post">
        <div class="form-group">
          <label for="Nama Lengkap"> Nama Lengkap</label>
          <input type="text" placeholder="Isi nama lengkap anda" />
        </div>
        <div class="form group">
          <label for="Email">Email</label>
          <input type="text" placeholder="ex:admin@gmail.com" />
        </div>
        <div class="form-group">
          <label for="">Tanggal Lahir</label>
          <input type="Date" />
        </div>
        <div class="form-group">
          <label for="">Jenis Kelamin</label>
          <div class="radio-group">
            <input type="radio" id="Jenis Kelamin" value="L" /> Laki-laki
            <input type="radio" id="Jenis Kelamin" value="P" /> Perempuan
          </div>
        </div>
        <div class="form-group">
          <label for="">Agama</label>
          <select name="Agama" id="Agama">
            <option value="">Pilih Agama</option>
            <option value="">Islam</option>
            <option value="">Hindu</option>
            <option value="">Budha</option>
            <option value="">Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label for="">Hobi</label>
          <div class="checkbox-group">
            <input type="checkbox" id="Hobi" /> Gambar
            <input type="checkbox" id="Hobi" /> Membaca
            <input type="checkbox" id="Hobi" /> Olahraga
          </div>
        </div>
        <button>Simpan</button>
      </form>
    </div>
  </body>
</html>
