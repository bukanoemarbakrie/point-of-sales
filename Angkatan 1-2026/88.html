<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quiz</title>
  </head>
  <body>
    <!-- 
    Kota : Jakarta, Bandung, Surabaya
    Tarif per kg berbeda tiap kota 
    soal : Hitung total ongkir
    Jakarta, 10 kg 100.000
    
    output : Total ongkir : Rp. 100.000
    -->

    <script>
      let kota = "Bandung";
      let berat = 4;
      let tarif = 12000;

      if (kota === "Bandung") {
        tarif = 12000;
      } else if (kota === "Jakarta") {
        tarif = 10000;
      } else if (kota === "Surabaya") {
        tarif = 20000;
      }

      console.log(`Total Ongkir Bandung : ${tarif * berat}`);
      console.log(`Total berat Bandung : ${berat + berat}`);
    </script>
  </body>
</html>
